name: Unit Test CI

on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
        - os: ubuntu-24.04-arm
          expander_leg: ubuntu-24.04-arm--x64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: |
          20
          21
          22
        distribution: adopt
        mvn-toolchain-vendor: AdoptOpenJDK
        cache: maven
    - name: Compile, run tests, and package (JDK 20/21/22)
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: mvn -B package -Dmulti-jdk

      # Always upload build output and test reports, even on failure
    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
          # give each OS its own artifact bundle
        name: build-artifacts-${{ matrix.os }}
        path: |-
          jlama-cli/target/jlama-cli.jar
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
